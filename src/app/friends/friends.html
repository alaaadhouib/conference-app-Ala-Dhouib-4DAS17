<div class="card">
  <div class="card-icon">👥</div>
  <div class="card-body">
    <h2>Liste des amis</h2>

    <div class="add">
      <input class="input" placeholder="Nom d'un ami" [(ngModel)]="newFriend" (keyup.enter)="addFriend()" />
      <button class="btn" (click)="addFriend()">Ajouter</button>
    </div>

    <ul>
      @for (friend of friends(); track $index) {
        <li>{{ friend }}</li>
      } @empty {
        <li class="empty">Aucun ami pour le moment.</li>
      }
    </ul>
  </div>
</div>
